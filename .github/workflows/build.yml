
name: Build LUXZCO AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o luxzco-ai-aplikasi-android.zip -d extracted
          cp -r extracted/luxzco-ai-native/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin targets
        working-directory: android
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(r'\n\s*compileOptions\s*\{[^{}]*\}', '', s)
          s = re.sub(r'\n\s*kotlinOptions\s*\{[^{}]*\}', '', s)

          start = s.find("android")
          start = s.find("{", start)
          depth = 0
          end = -1

          for i in range(start, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break

          if end < 0:
              raise Exception("Blok android tidak ditemukan")

          config = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          s = s[:end] + config + s[end:]
          p.write_text(s)
          print("Java dan Kotlin berhasil diatur ke 17")
          PY

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUXZCO-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
